name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    # No API key needed: dataset integrity, grader unit tests, and the
    # oracle/null harness check with code graders only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: uv run pytest -q
      - run: uv run cimeval run --agent oracle --no-judge
      - run: uv run cimeval run --agent null --no-judge
