[project]
name = "alt-invest-agent-evals"
version = "0.1.0"
description = "A Claude-powered CIM screening agent for private equity, with the eval harness that measures it."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["anthropic>=2.3,<3", "pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cimeval = "cimeval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cimscreen", "src/cimeval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
